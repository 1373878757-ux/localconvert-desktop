[package]
name = "localconvert-desktop"
version = "0.9.0"
description = "Pure local desktop file conversion app shell."
authors = ["LocalConvert Desktop"]
edition = "2021"
rust-version = "1.89"
default-run = "localconvert-desktop"

[lib]
name = "localconvert_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
simulated-users = ["dep:sha2"]

[[bin]]
name = "simulated-users"
path = "src/bin/simulated-users.rs"
required-features = ["simulated-users"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
webpx = { version = "=0.4.0", default-features = false, features = ["encode", "std"] }
